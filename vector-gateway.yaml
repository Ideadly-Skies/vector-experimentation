# Vector Gateway Configuration
# Receives logs from Vector Agent via HTTPS and outputs to console
# Environment variables are loaded from .env file
data_dir: "${VECTOR_GATEWAY_DATA_DIR:-./vector-data-gateway}"

sources:
  # Receive logs from Vector Agent via HTTPS
  from_agent:
    type: http_server
    address: "${VECTOR_GATEWAY_ADDRESS:-0.0.0.0}:${VECTOR_GATEWAY_PORT:-8686}"
    encoding: json

    # TLS Configuration for secure HTTPS communication
    tls:
      enabled: true
      crt_file: "${TLS_GATEWAY_CERT_FILE:-./certs/gateway.crt}"
      key_file: "${TLS_GATEWAY_KEY_FILE:-./certs/gateway.key}"
      # Optionally require client certificates (mutual TLS)
      # ca_file: "${TLS_CA_FILE:-./certs/ca.crt}"
      # verify_certificate: true

    # Acknowledge all requests immediately
    acknowledgements:
      enabled: true

sinks:
  # Print all received logs to console
  console_output:
    type: console
    inputs:
      - from_agent
    encoding:
      codec: json
    # Pretty print for better readability
    # target: stdout
