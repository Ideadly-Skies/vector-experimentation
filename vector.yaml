# Vector Configuration for SSBAdapter Log Processing
data_dir: "./vector-data"

sources:
  # Read SSBAdapter.log file - tailing from the end
  ssb_adapter_logs:
    type: file
    include:
      - "./example-data/SSBAdapter.log"
    # Start reading from the beginning to process existing logs
    read_from: beginning
    # Optional: handle log rotation
    # glob_minimum_cooldown_ms: 60000

transforms:
  # Parse the log format: [timestamp] LEVEL - [correlationId] - message
  parse_ssb_logs:
    type: remap
    inputs:
      - ssb_adapter_logs
    source: |
      # Parse the log line format
      parsed, err = parse_regex(.message, r'^\[(?P<timestamp>[^\]]+)\]\s+(?P<level>\w+)\s+-\s+\[(?P<correlation_id>[^\]]+)\]\s+-\s+(?P<log_message>.*)$')

      if err != null {
        log("Failed to parse log line: " + string!(.message), level: "warn")
        .unparsed_message = .message
        .log_message = .unparsed_message
        .event_type = "parse_failed"
      } else {
        # Extract fields when parsing succeeded
        .timestamp = parsed.timestamp
        .log_level = parsed.level
        .correlation_id = parsed.correlation_id
        .log_message = parsed.log_message

        # Parse timestamp to proper format
        .parsed_timestamp, ts_err = parse_timestamp(.timestamp, format: "%Y-%m-%d %H:%M:%S%.3f")
        if ts_err == null {
          .@timestamp = .parsed_timestamp
        }
      }

      # Extract structured information from log message
      # Check for specific patterns
      if contains(string!(.log_message), "START HTTP") {
        .event_type = "http_start"
      } else if contains(string!(.log_message), "END HTTP") {
        .event_type = "http_end"
      } else if contains(string!(.log_message), "START GET TOKEN") {
        .event_type = "token_start"
      } else if contains(string!(.log_message), "END GET TOKEN") {
        .event_type = "token_end"
      } else if contains(string!(.log_message), "ParentTranSeqId") {
        .event_type = "transaction_info"
        # Extract transaction details
        txn_match, _ = parse_regex(.log_message, r'ParentTranSeqId = (?P<parent_seq>[^,]+), RqUID = (?P<rq_uid>[^,]+), CorrelId = (?P<correl_id>.+)$')
        if txn_match != null {
          .parent_transaction_seq_id = txn_match.parent_seq
          .request_uid = txn_match.rq_uid
          .correlation_id_detail = txn_match.correl_id
        }
      } else if contains(string!(.log_message), "Message has been sent") {
        .event_type = "message_sent"
        # Extract URL
        url_match, _ = parse_regex(.log_message, r'URL = (?P<url>.+)$')
        if url_match != null {
          .target_url = url_match.url
        }
      } else if contains(string!(.log_message), "SourceSystem") {
        .event_type = "source_system"
        sys_match, _ = parse_regex(.log_message, r'SourceSystem = (?P<system>.+)$')
        if sys_match != null {
          .source_system = sys_match.system
        }
      } else {
        .event_type = "other"
      }

      # Add metadata
      .source_file = "SSBAdapter.log"
      .adapter_type = "SSB"

      # Remove the original unparsed message field
      del(.message)

sinks:
  console_out:
    type: console
    inputs:
      - parse_ssb_logs
    encoding:
      codec: json

  # Direct Loki connection (currently active)
  loki_direct:
    type: loki
    inputs:
      - parse_ssb_logs
    endpoint: "http://localhost:3100"
    healthcheck:
      enabled: false
    encoding:
      codec: json
    labels:
      service: "ssb-adapter"
      environment: "dev"

