# Sink: Send to Vector Gateway (agent → gateway communication via Vector protocol)
sinks:
  to_gateway:
    type: vector
    inputs:
      - parse_adapter_logs

    # Vector protocol address with environment variable support
    address: "${VECTOR_GATEWAY_HOST:-localhost}:${VECTOR_GATEWAY_PORT:-9000}"

    # TLS Configuration for secure communication
    tls:
      enabled: true
      ca_file: "${TLS_CA_FILE:-./certs/ca.crt}"
      verify_certificate: true
      verify_hostname: true

    # Health check configuration
    healthcheck:
      enabled: true

    # Acknowledgements for reliable delivery
    acknowledgements:
      enabled: true
